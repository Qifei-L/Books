<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="appbar">
    <div class="brand"><strong>Books</strong><span class="tag">preview</span></div>
    <div id="switcher" class="context hidden">
      <select id="org-pick" title="Organization"></select>
      <select id="ledger-pick" title="Company"></select>
      <span id="ledger-meta" class="meta"></span>
    </div>
    <div class="appbar-end">
      <button id="demo" class="secondary small" title="Creates a demo organization with a year of sample data through the normal API rules">New demo</button>
      <span id="who" class="who"></span>
    </div>
  </header>

  <main>
    <section id="signin" class="card signin hidden">
      <h2>Sign in (local test issuer)</h2>
      <p class="muted">Development only. A token is issued by the in-memory local issuer; no real identity provider is involved.</p>
      <form id="signin-form">
        <label>Subject <input name="subject" value="demo-user" required></label>
        <label>Email <input name="email" value="demo@example.test" type="email" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="home" class="hidden">
      <p id="no-ledger" class="card muted hidden">No company you can see yet. Use <b>New demo</b> to create one with sample data.</p>
      <div id="ledger" class="workspace hidden">
        <!-- Modules grouped by what people do: trade, stock, records, books, reports, tax, settings. -->
        <nav class="sidenav">
          <div class="nav-group">Business</div>
          <button data-tab="sales" class="active">Sales</button>
          <button data-tab="purchases">Purchases</button>
          <button data-tab="bank">Cash and bank</button>
          <button data-tab="payroll">Payroll</button>

          <div class="nav-group">Stock and assets</div>
          <button data-tab="inventory">Inventory</button>
          <button data-tab="assets">Fixed assets</button>

          <div class="nav-group">Records</div>
          <button data-tab="parties">Customers and suppliers</button>
          <button data-tab="banks">Bank accounts</button>
          <button data-tab="taxcodes">Tax codes</button>

          <div class="nav-group">Books</div>
          <button data-tab="journals">Journals</button>
          <button data-tab="chart">Chart of accounts</button>

          <div class="nav-group">Reports</div>
          <button data-tab="pl">Profit and loss</button>
          <button data-tab="bs">Balance sheet</button>
          <button data-tab="tb">Trial balance</button>
          <button data-tab="gl">GL detail</button>

          <div class="nav-group">Tax</div>
          <button data-tab="tax">Tax return</button>

          <div class="nav-group">Settings</div>
          <button data-tab="settings-ledger">Ledger and periods</button>
          <button data-tab="settings-invoicing">Invoicing</button>
          <button data-tab="settings-org">Organization</button>
        </nav>

        <div class="page">
          <header class="page-head">
            <div class="page-heading">
              <h1 id="page-title">Sales</h1>
              <p id="page-sub" class="page-sub"></p>
            </div>
          </header>
          <div class="page-body">
            <div id="tab-chart" class="tab hidden"></div>
            <div id="tab-journals" class="tab hidden"></div>
            <div id="tab-tb" class="tab hidden">
              <form class="inline filter-bar" id="tb-form">
                <label>From <input type="date" name="from" value="2026-01-01"></label>
                <label>To <input type="date" name="to" value="2026-10-31"></label>
                <button type="submit">Run</button>
                <button type="button" class="secondary" data-export="trial-balance">Excel</button>
              </form>
              <div id="tb-out"></div>
            </div>
            <div id="tab-gl" class="tab hidden">
              <form class="inline filter-bar" id="gl-form">
                <label>Account <select name="account"></select></label>
                <label>From <input type="date" name="from" value="2026-01-01"></label>
                <label>To <input type="date" name="to" value="2026-10-31"></label>
                <button type="submit">Run</button>
                <button type="button" class="secondary" data-export="gl-detail">Excel</button>
              </form>
              <div id="gl-out"></div>
            </div>
            <div id="tab-pl" class="tab hidden">
              <form class="inline filter-bar" id="pl-form">
                <label>From <input type="date" name="from" value="2026-01-01"></label>
                <label>To <input type="date" name="to" value="2026-10-31"></label>
                <button type="submit">Run</button>
                <button type="button" class="secondary" data-export="profit-and-loss">Excel</button>
              </form>
              <div id="pl-out"></div>
            </div>
            <div id="tab-parties" class="tab hidden"></div>
            <div id="tab-banks" class="tab hidden"></div>
            <div id="tab-taxcodes" class="tab hidden"></div>
            <div id="tab-settings-ledger" class="tab hidden"></div>
            <div id="tab-settings-invoicing" class="tab hidden"></div>
            <div id="tab-settings-org" class="tab hidden"></div>
            <div id="tab-sales" class="tab"></div>
            <div id="tab-payroll" class="tab hidden"></div>
            <div id="tab-purchases" class="tab hidden"></div>
            <div id="tab-bank" class="tab hidden"></div>
            <div id="tab-inventory" class="tab hidden"></div>
            <div id="tab-assets" class="tab hidden"></div>
            <div id="tab-tax" class="tab hidden"></div>
            <div id="tab-bs" class="tab hidden">
              <form class="inline filter-bar" id="bs-form">
                <label>As of <input type="date" name="asOf" value="2026-10-31"></label>
                <button type="submit">Run</button>
                <button type="button" class="secondary" data-export="balance-sheet">Excel</button>
              </form>
              <div id="bs-out"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <dialog id="journal-dialog">
      <div id="journal-body"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>

    <dialog id="form-dialog" class="wide"></dialog>

    <p id="error" class="error hidden"></p>
  </main>

  <script src="app.js"></script>
  <script src="forms.js"></script>
  <script src="inventory.js"></script>
  <script src="setup.js"></script>
  <script src="payroll.js"></script>
  <script src="stock.js"></script>
</body>
</html>
